name: exilelab-alexandrie
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alexandrie}
      MYSQL_USER: ${MYSQL_USER:-alexandrie}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - exilelab-alexandrie-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} -e 'SELECT 1' $${MYSQL_DATABASE}",
        ]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 30s

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "${RUSTFS_CONSOLE_ENABLE:-false}"
      RUSTFS_LOG_LEVEL: ${RUSTFS_LOG_LEVEL:-info}
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    networks:
      - exilelab-alexandrie-network
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.exilelab-alexandrie-cdn.rule=Host(`${CDN_DOMAIN}`)
      - traefik.http.routers.exilelab-alexandrie-cdn.entrypoints=websecure
      - traefik.http.routers.exilelab-alexandrie-cdn.tls=true
      - traefik.http.routers.exilelab-alexandrie-cdn.tls.certresolver=letsencrypt
      - traefik.http.services.exilelab-alexandrie-cdn.loadbalancer.server.port=9000
      - traefik.docker.network=coolify

  backend:
    image: ghcr.io/smaug6739/alexandrie-backend:latest
    restart: unless-stopped
    environment:
      BACKEND_PORT: 8201
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      FRONTEND_URL: ${FRONTEND_URL}
      ALLOW_UNSECURE: "false"
      CONFIG_DISABLE_SIGNUP: ${CONFIG_DISABLE_SIGNUP:-false}
      CONFIG_DISABLE_NATIVE_LOGIN: ${CONFIG_DISABLE_NATIVE_LOGIN:-false}
      CONFIG_HIDE_NATIVE_LOGIN_FORM: ${CONFIG_HIDE_NATIVE_LOGIN_FORM:-false}
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-alexandrie}
      DATABASE_USER: ${MYSQL_USER:-alexandrie}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      MINIO_ENDPOINT: rustfs:9000
      MINIO_PUBLIC_URL: ${CDN_URL}
      MINIO_SECURE: "false"
      MINIO_INSECURE_TLS: "false"
      MINIO_ACCESSKEY: ${RUSTFS_ACCESS_KEY}
      MINIO_SECRETKEY: ${RUSTFS_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-alexandrie}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_MAIL: ${SMTP_MAIL:-}
      SMTP_MAIL_FROM: ${SMTP_MAIL_FROM:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # OIDC opsiyonel; 1..10 arası tanımlanabilir.
      # OIDC_1_PROVIDER_NAME: ${OIDC_1_PROVIDER_NAME:-}
      # OIDC_1_CONFIG_URL: ${OIDC_1_CONFIG_URL:-}
      # OIDC_1_CLIENT_ID: ${OIDC_1_CLIENT_ID:-}
      # OIDC_1_CLIENT_SECRET: ${OIDC_1_CLIENT_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - exilelab-alexandrie-network
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.exilelab-alexandrie-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.exilelab-alexandrie-api.entrypoints=websecure
      - traefik.http.routers.exilelab-alexandrie-api.tls=true
      - traefik.http.routers.exilelab-alexandrie-api.tls.certresolver=letsencrypt
      - traefik.http.services.exilelab-alexandrie-api.loadbalancer.server.port=8201
      - traefik.docker.network=coolify

  frontend:
    image: ghcr.io/smaug6739/alexandrie-frontend:latest
    restart: unless-stopped
    environment:
      PORT: 8200
      NUXT_PUBLIC_CONFIG_DISABLE_SIGNUP_PAGE: ${CONFIG_DISABLE_SIGNUP:-false}
      NUXT_PUBLIC_CONFIG_DISABLE_LANDING_PAGE: ${CONFIG_DISABLE_LANDING:-false}
      NUXT_PUBLIC_BASE_API: ${API_URL}
      NUXT_PUBLIC_BASE_CDN: ${CDN_URL}
      NUXT_PUBLIC_CDN_ENDPOINT: ${CDN_ENDPOINT:-/alexandrie/}
      NUXT_PUBLIC_BASE_URL: ${FRONTEND_URL}
    depends_on:
      - backend
    networks:
      - exilelab-alexandrie-network
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.exilelab-alexandrie.rule=Host(`${FRONTEND_DOMAIN}`)
      - traefik.http.routers.exilelab-alexandrie.entrypoints=websecure
      - traefik.http.routers.exilelab-alexandrie.tls=true
      - traefik.http.routers.exilelab-alexandrie.tls.certresolver=letsencrypt
      - traefik.http.services.exilelab-alexandrie.loadbalancer.server.port=8200
      - traefik.docker.network=coolify

networks:
  exilelab-alexandrie-network:
    driver: bridge
  coolify:
    external: true

volumes:
  mysql_data:
    name: ${COOLIFY_RESOURCE_UUID:-exilelab-alexandrie}_mysql_data
  rustfs_data:
    name: ${COOLIFY_RESOURCE_UUID:-exilelab-alexandrie}_rustfs_data
  rustfs_logs:
    name: ${COOLIFY_RESOURCE_UUID:-exilelab-alexandrie}_rustfs_logs
